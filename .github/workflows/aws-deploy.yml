  # ==========================================
  # 2. BUILD & DEPLOY .NET BACKEND TO BEANSTALK
  # ==========================================
  deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      id-token: write                                # Forces this runner machine to issue the secure OIDC token
      contents: read                                 # Allows this runner machine to clone your code
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::749957794937:role/GitHubActionsWorkflowRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'                     # Adjust if using a different .NET version

      - name: Publish .NET Application
        run: |
          dotnet publish ./backend/backend.csproj -c Release -o ./publish

      - name: Create Deployment Package
        run: |
          cd ./publish
          zip -r ../deploy-${{ github.sha }}.zip .

      - name: Upload Package to S3
        run: |
          aws s3 cp deploy-${{ github.sha }}.zip s3://${{ env.EB_DEPLOY_BUCKET_NAME }}/deploy-${{ github.sha }}.zip

      - name: Deploy New Version to Elastic Beanstalk
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "${{ env.EB_APPLICATION_NAME }}" \
            --version-label "release-${{ github.sha }}" \
            --source-bundle S3Bucket="${{ env.EB_DEPLOY_BUCKET_NAME }}",S3Key="deploy-${{ github.sha }}.zip"
          
          aws elasticbeanstalk update-environment \
            --environment-name "${{ env.EB_ENVIRONMENT_NAME }}" \
            --version-label "release-${{ github.sha }}"
